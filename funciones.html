      function Promedio(suma, cantidad) {
        return suma / cantidad;
      }

      let sum = 0;

      for (let i = 1; i <= 5; i++) {
        let n = Number(prompt("Ingrese un número"));
        sum += n;
      }
      prom = Promedio(sum, 5);
      console.log(prom);
