<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Lista del súper · Paso 1.7 · Ejercicio B</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 id="titulo">Lista del súper</h1>
    <p class="subtitulo">Lo que hay que comprar esta semana</p>

    <form id="form-agregar">
      <label for="nuevo">Producto</label>
      <input id="nuevo" placeholder="¿Qué falta?" required minlength="2" />

      <label for="cantidad">Cantidad</label>
      <input id="cantidad" type="number" value="1" required min="1" max="20" />

      <label><input id="urgente" type="checkbox" /> Urgente</label>

      <button type="submit">Agregar</button>
    </form>
    <p id="error" class="error"></p>

    <ul id="lista"></ul>

    <p id="resumen"></p>
  </body>
</html>
