<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Lista del súper · Paso 1.4 · Ejercicio A</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 id="titulo">Lista del súper</h1>
    <p class="subtitulo">Lo que hay que comprar esta semana</p>

    <form id="form-agregar">
      <label for="nuevo">Producto</label>
      <input id="nuevo" placeholder="¿Qué falta?" />

      <label for="cantidad">Cantidad</label>
      <input id="cantidad" type="number" value="1" />

      <label><input id="urgente" type="checkbox" /> Urgente</label>

      <!-- ★ NUEVO (ejercicio A) -->
      <label for="categoria">Categoría</label>
      <select id="categoria">
        <option value="Almacén">Almacén</option>
        <option value="Verdulería">Verdulería</option>
        <option value="Limpieza">Limpieza</option>
      </select>

      <button type="submit">Agregar</button>
    </form>
    <p id="error" class="error"></p>

    <ul id="lista"></ul>

    <p id="resumen"></p>
  </body>
</html>
