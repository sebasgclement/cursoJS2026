  <body>
    <h1>Promesas</h1>
    <p>
      Una promesa es como el ticket de un pedido: todavía no tenés la pizza, pero te van a avisar
      cuando esté (o si se quemó). Tocá el botón varias veces: a veces sale bien y a veces no.
    </p>
    <button id="pedir">Pedir pizza</button>
    <p id="estado"></p>
