      let contador = 1;
      let acumulador = 0;
      let x = "S";
      while (x === "S") {
        let n = Number(prompt("Ingrese un numero"));
        contador++;
        acumulador += n;
        x = prompt("Desea seguir ingresando? S/N");
      }
      let promedio = acumulador / contador;
      console.log(`El promedio de los valores es ${promedio}`);
